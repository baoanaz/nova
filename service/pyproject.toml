[project]
name = "zace-service"
version = "0.0.1"
description = "zace 服务化外壳（Module/06）：HTTP API / 鉴权 / 租户映射 / 索引 job / 审计"
requires-python = ">=3.12"
license = "Unlicense"
dependencies = [
    "zace-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",        # 密码哈希（Module/06 §2.2）
    "itsdangerous>=2.2",        # session cookie 签名
    # TASK-040（R38：M2a 由 service 直出 MCP Streamable HTTP，编辑器填 URL 直连）：
    # 2.x 起 FastMCP 更名为 MCPServer（导入路径 `mcp.server.mcpserver`），卡内已按 2.2.0 实测。
    "mcp>=2.2",
]

[project.optional-dependencies]
# TASK-112：pytest-xdist 用于并行跑测试（本仓 1100+ 用例、串行约 3 分钟）。
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
# TASK-030：服务入口（argparse + uvicorn.run）。仅新增 scripts 段，依赖清单不变（不新增第三方依赖）。
zace-service = "zace_service.__main__:main"

[tool.uv.sources]
zace-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zace_service"]
