name: ci

on:
  push:
  pull_request:

jobs:
  python:
    name: python (core + service)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync workspace
        run: uv sync --all-packages --all-extras
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Dependency direction check (D-33/D-34/D-35)
        run: uv run python scripts/check_dependency_direction.py
      - name: Version consistency (core/npm/server + npm 平台子包，D-48/D-49)
        run: bash scripts/check-version.sh
      - name: Environment (diagnostics)
        run: |
          uv run python -VV
          uv run python -c "import locale,sys; print('locale:', locale.getlocale(), '| fs:', sys.getfilesystemencoding())"
          uv run python -c "import jieba, lancedb, pyarrow; print('jieba', jieba.__version__)" 2>/dev/null || true
          nproc
      - name: Tests
        shell: bash
        run: |
          set -o pipefail        # tee 会吞掉 pytest 的退出码，必须显式打开
          uv run pytest -ra 2>&1 | tee /tmp/pytest.log
      - name: Upload pytest output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output
          path: /tmp/pytest.log
          if-no-files-found: ignore

  web:
    name: web (nova-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build (includes tsc --noEmit)
        run: npm run build
