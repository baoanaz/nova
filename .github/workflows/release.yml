# 发布 nova-client：构建 6 平台二进制 → 发 npm 平台子包 → 发主包 → 验证 → 切 latest。
#
# 触发：推送 v* tag（或手动 dispatch）。
#
# ## 唯一的二进制分发渠道是 npm（D-48/D-49）
#
# 不再发 GitHub Release 二进制资产、也不再有「包装器从 GitHub 下载」这条路。
# 用户拿二进制的方式**只有**：npm 按子包的 `os`/`cpu` 装 `nova-client-<os>-<arch>`。
#
# 为什么（实测 2026-09-16）：Node 默认不读 `https_proxy`（只认 `NODE_USE_ENV_PROXY=1`），
# 代理环境里直连 GitHub 会命中共享出口 IP 的 403 rate limit（curl 走代理 200、node 直连 403）；
# 且保留下载回退 = 两条分发渠道并存，出错时无法判断用户拿到的是哪个二进制。
#
# ## 发布流水线（六步，每步都有硬门）
#
#   ① build 6 平台（**每个架构独立构建**，不用 lipo/universal）
#   ② publish-platforms   发 6 个平台子包
#   ③ pre-verify          验证 6 个子包在 registry 上都能查到该版本  ← 缺一个就停
#   ④ publish-main        发主包（**--tag next**，此时 latest 不动）
#   ⑤ promote             验证 next 可安装 → 把 latest 切到该版本
#   ⑥ post-verify         验证 latest 指向该版本
#
# ## 为什么主包先发 `next` 而不是直接 `latest`
#
# npm 发布**不可逆**（同一版本不能重发）。直接发 latest 意味着：一旦子包有问题，
# 所有 `npx nova-client@latest` 的用户**立刻**拿到坏包，只能靠升版本修。
# 先发 next 则 latest 仍指向旧的好版本——用户不受影响，我们有时间验证与补救。
#
# ## 为什么 macOS 不用 universal（lipo）
#
# universal 是为了「一个二进制同时供两个架构」。但子包机制下 x64 与 arm64 本就是**两个包**，
# 合并只会：① 让每个用户多下另一个架构的代码（体积翻倍）；② 让 `file(1)` 校验、
# 签名与后续按架构排查都变复杂。故两个架构**各自独立构建**。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "要发布构建的版本（默认取 npm/package.json，手动 dispatch 时用）"
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux（musl 静态：不依赖用户的 glibc 版本）----
          - suffix: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: nova-client
            npm_binary: nova-client
            cross: false
          - suffix: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary_name: nova-client
            npm_binary: nova-client
            cross: true            # x86_64 runner 上编 aarch64-musl 需要 cross
          # ---- macOS（两个架构各自独立，不用 lipo）----
          - suffix: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            binary_name: nova-client
            npm_binary: nova-client
            cross: false
          - suffix: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            binary_name: nova-client
            npm_binary: nova-client
            cross: false
          # ---- Windows ----
          - suffix: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: nova-client.exe
            npm_binary: nova-client.exe
            cross: false
          - suffix: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            binary_name: nova-client.exe
            npm_binary: nova-client.exe
            cross: false

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: ${{ matrix.target }}

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}

      # 收到一个固定路径，上传与 stage 都不必猜（此前“universal 产物在 target/release/
      # 但上传路径写 target/universal-apple-darwin/”就是一个真实缺陷）。
      - name: Collect (unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        run: |
          cd target/${{ matrix.target }}/release
          strip ${{ matrix.binary_name }} || true
          mkdir -p "$GITHUB_WORKSPACE/client/dist"
          cp ${{ matrix.binary_name }} "$GITHUB_WORKSPACE/client/dist/${{ matrix.npm_binary }}"

      - name: Collect (windows)
        if: contains(matrix.target, 'windows')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/client/dist" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" `
            "$env:GITHUB_WORKSPACE/client/dist/${{ matrix.npm_binary }}"

      # **每个平台一个 artifact**，名字即后缀：不能用 merge-multiple 汇总，
      # 因为多个平台的文件名相同（`nova-client` / `nova-client.exe`），
      # 汇到一个目录再用 `find | head -1` 定位会随机取到**别的平台**。
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.suffix }}
          path: client/dist/${{ matrix.npm_binary }}
          if-no-files-found: error

  # ② 发布 6 个平台子包（必须先于主包：主包的 optionalDependencies 要能解析到）。
  publish-platforms:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: npm-binaries
          pattern: binary-*

      - name: Stage binaries into platform packages
        run: |
          set -euo pipefail
          stage_one() {
            local suffix="$1" binary="$2"
            local found
            found="$(find "npm-binaries/binary-$suffix" -name "$binary" -type f | head -1)"
            if [ -z "$found" ]; then
              echo "✗ artifact binary-$suffix 里找不到 $binary" >&2
              exit 1
            fi
            python3 scripts/make-platform-packages.py stage --suffix "$suffix" --binary "$found"
          }
          stage_one linux-x64    nova-client
          stage_one linux-arm64  nova-client
          stage_one darwin-x64   nova-client
          stage_one darwin-arm64 nova-client
          stage_one windows-x64    nova-client.exe
          stage_one windows-arm64  nova-client.exe

      - name: Guard (versions + 6 platform packages present)
        run: |
          set -euo pipefail
          bash scripts/check-version.sh
          python3 scripts/make-platform-packages.py check

      - name: Publish platform packages
        run: python3 scripts/make-platform-packages.py publish --phase platforms
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ③ 前置验证：6 个子包都真的在 registry 上「可查到该版本」。
  #    registry 同步有秒级延迟，故带重试；**缺一个就停，绝不发主包**。
  pre-verify:
    needs: publish-platforms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify platform packages exist
        run: python3 scripts/make-platform-packages.py verify --phase platforms
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ④ 发主包到 **next** 标签：此时 `@latest` 仍指向旧版本，用户不受影响。
  publish-main:
    needs: pre-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish main package to next
        run: python3 scripts/make-platform-packages.py publish --phase main --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ⑤ 切换 latest：**先验证 next 可安装可启动**（真实 npx 跑一次），再 promote。
  #    这是「用户拿到坏包」的唯一防线——npm 发布不可逆，promote 是最后一个可控点。
  promote:
    needs: publish-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke test the next tag (真实安装 + 启动)
        run: python3 scripts/make-platform-packages.py smoke --tag next

      - name: Promote next to latest
        run: python3 scripts/make-platform-packages.py promote
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ⑥ 后置验证：latest 已指向该版本，且子包仍可解析。
  post-verify:
    needs: promote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify latest points at this version
        run: python3 scripts/make-platform-packages.py verify --phase latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
