# nova workspace 根配置（虚拟根，非包；包成员见 core/ 与 service/）
# 用法：uv sync --all-packages --all-extras

[tool.uv.workspace]
members = ["core", "service"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "client", "web", "benches/golden"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 一次性探针脚本里内嵌了很长的提示词/样本字符串，不值得为行宽拆开。
"benches/cloudflare_qwen_probe.py" = ["E501"]

[tool.pytest.ini_options]
# ``tests/``：根级跨制品护栏（npm 平台子包一致性 D-48/D-49 等）。
# 它不是 Python 包，但必须进默认测试集，否则“静默故障”类约定无人守。
testpaths = ["core/tests", "service/tests", "tests"]
addopts = "-q -n auto"
