# 独立端口，仅用于 zace UI 演示。
limit_req_zone $binary_remote_addr zone=zace_ui_demo_login:1m rate=5r/m;

server {
    listen 8088;
    listen [::]:8088;
    server_name _;
    root /var/www/zace-ui-demo;
    index index.html;
    client_max_body_size 8k;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-UI-Demo true always;

    location = /api/auth/login {
        limit_req zone=zace_ui_demo_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8789;
    }

    location ~ \.map$ { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-UI-Demo true always;
    }
}
