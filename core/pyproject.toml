[project]
name = "zace-core"
version = "0.0.1"
description = "zace 核心引擎纯库（Module/01-04）：切片存储 / 检索 / 上下文组装 / AI 总结"
requires-python = ">=3.12"
license = "Unlicense"
# 纯库纪律（D-34）：本清单禁止出现 HTTP 服务框架 / 用户体系 / 租户依赖，
# 由 scripts/check_dependency_direction.py 在 CI 强制。
# 具体版本由各任务（TASK-001..014）落地时锁定到 uv.lock。
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "jieba>=0.42",              # D-45：CJK 分词（索引/查询双侧预分词）
    "lancedb>=0.15",            # D-03：per-project 向量库
    "pyarrow>=15",
    "numpy>=1.26",
    "onnxruntime>=1.18",        # D-44：本地 embedding 默认实现
    "tokenizers>=0.20",
    "huggingface-hub>=0.24",    # 本地模型下载/缓存
    "httpx>=0.27",              # 出站 HTTP 客户端（API embedding / AnswerProvider），非服务框架
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff>=0.6", "jsonschema>=4.21"]  # CF-03：TASK-012 对 ContextPack JSON 做 schema 校验

[project.scripts]
zace-core = "zace_core.cli:main"   # TASK-013 实现

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zace_core"]
