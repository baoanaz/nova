[package]
name = "nova-client"
version = "0.0.8"
edition = "2021"
description = "nova MCP stdio client: local scan/hash/upload proxy for a remote nova-service"
license = "Unlicense"
# 为什么是 Rust（D-39 / Module/05）：MCP 最终形态是本地 client（stdio 对编辑器 + HTTPS 对远端
# service）。本地 MCP（service 直出 Streamable HTTP，R38）只作短期验证。
# 落点说明见 docs/tasks/TASK-040R-client骨架与同步代理.md「执行记录」。

[lib]
name = "nova_client"
path = "src/lib.rs"

[[bin]]
name = "nova-client"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
ignore = "0.4"          # D-28：.gitignore 真实解析（Module 05 §3.1 指定用 ignore crate）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# 二进制整体仍按体积优化；首次同步的热点 crate 单独按速度优化（体积影响很小）：
# 扫描时每个文件都要 sha256、上传要 base64 + JSON 序列化、遍历要做 gitignore 匹配。
[profile.release.package.sha2]
opt-level = 3

[profile.release.package.base64]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

[profile.release.package.regex-automata]
opt-level = 3

[profile.release.package.aho-corasick]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.globset]
opt-level = 3
