openapi: 3.1.0
info:
  title: nova-service REST API（冻结合同 CF-05）
  version: 0.0.1
  description: >
    来源 docs/design/Module/06-服务化与部署.md §2.1（D-37）。client 走 Bearer token，web 走 session cookie。
    幂等语义：batch-upload 重复 blobHash 返回 accepted；deletions 重复删除返回成功；resolve-project 幂等。
    V1 不加 /v1 前缀（同仓同步发版；公开 API 化时再版本化）。
servers:
  - url: https://{host}
    variables: { host: { default: nova.example.com } }
tags: [{ name: auth }, { name: projects }, { name: sync }, { name: query }, { name: ops }, { name: admin }]

components:
  securitySchemes:
    bearerToken: { type: http, scheme: bearer, bearerFormat: nova_api_token }
    sessionCookie: { type: apiKey, in: cookie, name: nova_session }
  schemas:
    Error:
      type: object
      properties:
        error: { type: object, properties: { code: { type: string }, message: { type: string } } }
    Project:
      type: object
      properties:
        projectId: { type: string }
        displayName: { type: string }
        createdAt: { type: integer }
    SyncStatus:
      type: object
      properties:
        projectId: { type: string }
        filesIndexed: { type: integer }
        chunks: { type: integer }
        symbols: { type: integer }
        edges: { type: integer }
        pendingJobs: { type: integer }
        indexingFiles: { type: array, items: { type: string } }
        indexProgress: { type: object, description: '后台状态：idle/running/done/failed，含 error；未完成不得检索' }
        skippedFiles: { type: array, items: { type: string } }
        lastIndexedAt: { type: integer, nullable: true }
    SearchResponse:
      type: object
      description: ContextPack 的 Markdown 渲染在服务端完成（D-21 / Module/05 §5）
      properties:
        markdown: { type: string }
        meta: { type: object, additionalProperties: true }
    AskResponse:
      type: object
      description: "D-24 短路 / D-26 降级 / TASK-088 LLM 四种情况共用（证据优先）。"
      properties:
        status: { enum: [answered, insufficient_evidence, degraded] }
        answer: { type: string, description: "answered/degraded 时为答案文本；insufficient_evidence 时不出现。" }
        bestEffortContext: { type: string, description: "仅 insufficient_evidence：render_markdown(pack)（TASK-087 §B）。" }
        missingEvidence:
          type: array
          description: "仅 insufficient_evidence：可读文本列表，与 ### Missing Evidence 同形。"
          items: { type: string }
        nextQueries:
          type: array
          description: "仅 insufficient_evidence：确定性生成的自愈查询（Module/03 §5）。"
          items: { type: string }
        evidenceSummary: { type: array, items: { type: object } }
        meta: { type: object, additionalProperties: true }
    Capabilities:
      type: object
      description: >
        TASK-110 §3.3：**后端是特权的唯一事实源**，前端只渲染这些位，不自己按角色判断。
        刻意**没有** projectLimit 字段（用户 2026-09-15 拍板不设项目数上限）。
      properties:
        canCustomKey: { type: boolean, description: "自定义 API Key（拓荒者 / 管理员特权）" }
        quotaBytes: { type: integer, description: "该用户**实际生效**的索引空间上限；0 = 不限" }
        earlyMemberNo: { type: integer, nullable: true, description: "内测编号（非内测恒为 null）" }
        isAdmin: { type: boolean, description: "管理员（后台入口与该用户能否访问 /api/admin/* 的依据）" }
    Account:
      type: object
      description: "TASK-110 §3.3：身份视图。`/api/auth/{me,login,register,bootstrap}` 共用此形态。"
      properties:
        userId: { type: string }
        name: { type: string }
        createdAt: { type: integer }
        isLocal: { type: boolean }
        via: { enum: [session, token, local] }
        role: { enum: [admin, beta, public] }
        title: { type: string, description: "头衔（执炬者 / 拓荒者 / 旅人），权威来自服务端 " }
        earlyMemberNo: { type: integer, nullable: true }
        capabilities: { $ref: '#/components/schemas/Capabilities' }
  responses:
    Unauthorized: { description: 401, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: 403, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

security:
  - bearerToken: []
  - sessionCookie: []

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: 注册（TASK-110 §1.1：**必须有邀请码**）
      security: []
      requestBody:
        content: { application/json: { schema: { type: object, required: [name, password, inviteCode], properties: { name: { type: string }, password: { type: string }, inviteCode: { type: string, description: "6 位大写字母/数字，首字母即类型：A=管理员 / B=内测 / C=公测" } } } } }
      responses:
        '201': { description: Account（含 role / title / earlyMemberNo / capabilities） }
        '400': { description: 邀请码缺失、形状不对、无效、已失效或已用尽（对外同一文案） }
        '409': { description: 账户名已被占用（事务回滚，邀请码不会被消耗） }
  /api/auth/login:
    post:
      tags: [auth]
      summary: 登录（web/CLI 通用；签发 session cookie）
      security: []
      responses: { '200': { description: Account }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/auth/logout:
    post:
      tags: [auth]
      responses: { '204': { description: No Content } }
  /api/auth/me:
    get:
      tags: [auth]
      summary: 当前身份（role / title / earlyMemberNo / capabilities）
      responses: { '200': { description: Account }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /api/auth/bootstrap:
    post:
      tags: [auth]
      summary: 首个用户初始化（空库时建账户并直接登录；TASK-110 起该账户**直接是管理员**）
      security: []
      requestBody:
        content: { application/json: { schema: { type: object, required: [name, password], properties: { name: { type: string }, password: { type: string } } } } }
      responses:
        '201': { description: Account（role=admin） }
        '403': { description: 已存在账户：初始化接口已关闭 }
  /api/auth/llm-config:
    put:
      tags: [auth]
      summary: 保存本用户的 LLM 配置（TASK-099 §C-3；响应不含 key 的任何部分）
      responses: { '200': { description: OK }, '400': { description: invalid_llm_config } }
    delete:
      tags: [auth]
      summary: 删除本用户的 LLM 配置（幂等：本来就没配也返回 204）
      responses: { '204': { description: No Content } }
  /api/auth/llm-config/test:
    post:
      tags: [auth]
      summary: LLM 连接自检（TASK-113；L1 探测 /v1/models，deep=true 叠加一次真实最小请求）
      responses: { '200': { description: ConnectionTestResult（ok/message/协议与模型信息，不含 key） }, '400': { description: invalid_llm_config } }
  /api/auth/tokens:
    post:
      tags: [auth]
      summary: 创建 API token（明文仅此一次返回）
      requestBody:
        content: { application/json: { schema: { type: object, properties: { name: { type: string }, key: { type: string, description: "TASK-110 §3.4：自定义 Key（拓荒者/管理员特权）。留空 = 服务端随机生成。须以 nova_ 开头且其后 ≥16 字符" } } } } }
      responses:
        '200': { description: '{ id, token, prefix, name, isCustom }' }
        '400': { description: invalid_custom_key（前缀/长度/字符集不符） }
        '403': { description: custom_key_forbidden（当前身份无自定义特权） }
        '409': { description: key_taken（该 Key 明文已被使用过） }
    get:
      tags: [auth]
      summary: 列出 token（不含明文；仅有效 Key）
      responses: { '200': { description: 'ApiKeySummary[]（含 isCustom）' } }
  /api/auth/tokens/{id}:
    delete:
      tags: [auth]
      summary: revoke token（软删）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: No Content }, '404': { description: token_not_found } }

  /api/projects/resolve:
    post:
      tags: [projects]
      summary: 按 identityKey（D-29）幂等解析/创建项目
      requestBody:
        content: { application/json: { schema: { type: object, required: [identityKey], properties: { identityKey: { type: string }, displayName: { type: string } } } } }
      responses: { '200': { description: '{ projectId, created }' } }
  /api/projects:
    get:
      tags: [projects]
      responses: { '200': { description: 'Project[]（本地模式追加 attachedRoot / indexProgress）' } }
  /api/projects/attach:
    post:
      tags: [projects]
      summary: 【本地模式】绑定目录并后台索引（TASK-034 / R44）；立即返回，不等索引完成
      requestBody:
        content: { application/json: { schema: { type: object, required: [root], properties: { root: { type: string, description: 本地目录绝对路径 }, displayName: { type: string } } } } }
      responses:
        '200': { description: '{ projectId, created, root, indexProgress }（幂等：已在索引中则返回当前进度）' }
        '400': { description: invalid_root }
        '403': { description: local_mode_required（非本地模式） }
  /api/projects/{id}/rescan:
    post:
      tags: [projects]
      summary: 【本地模式】手动触发增量重扫（TASK-034 §C）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '202': { description: '{ indexProgress }' }
        '409': { description: 'index_running（已在索引）/ local_root_unknown（重启后未 attach）' }
        '404': { description: project_not_found }
  /api/projects/{id}:
    get:
      tags: [projects]
      responses: { '200': { description: 'Project + SyncStatus（本地模式追加 attachedRoot / indexProgress）' } }
    delete:
      tags: [projects]
      summary: 级联删除（rm -rf 项目目录 + 元数据行；审计留痕）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: No Content } }

  /api/sync/batch-upload:
    post:
      tags: [sync]
      summary: 批量上传源码 blob（每批 ≤1MB；按 blobHash 幂等）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [projectId, blobs]
              properties:
                projectId: { type: string }
                branch: { type: string }
                commit: { type: string }
                deferIndexing: { type: boolean, default: false, description: '只持久化上传及待索引账本；客户端随后必须 flush 并等待完成' }
                blobs:
                  type: array
                  items:
                    type: object
                    required: [path, blobHash, contentB64]
                    properties:
                      path: { type: string }
                      blobHash: { type: string }
                      contentB64: { type: string, description: base64(文件原始字节)；JSON 传输二进制安全编码，冻结）
      responses: { '200': { description: '{ accepted: [blobHash], skipped: [path], report, indexingDeferred }；延迟模式 report=null，accepted 不表示已索引' } }
  /api/sync/flush:
    post:
      tags: [sync]
      summary: 合并持久待处理账本并启动单项目后台索引；重复触发不排队，失败/重启后可重试
      requestBody:
        content: { application/json: { schema: { type: object, required: [projectId], properties: { projectId: { type: string } } } } }
      responses: { '200': { description: '{ indexProgress }；通过 sync/status 等待 pendingJobs=0 且无错误；120 秒未完成客户端返回后台处理中提示' } }
  /api/sync/checkpoint:
    post:
      tags: [sync]
      summary: 提交 scope blob 集合，换取 checkpointId（检索请求携带，避免每次传全量名单）
      requestBody:
        content: { application/json: { schema: { type: object, required: [projectId, blobHashes], properties: { projectId: { type: string }, blobHashes: { type: array, items: { type: string } } } } } }
      responses: { '200': { description: '{ checkpointId }' } }
  /api/sync/deletions:
    post:
      tags: [sync]
      summary: 通知删除路径（按 (projectId,path) 幂等；级联删索引 + spec_references.stale=1）
      requestBody:
        content: { application/json: { schema: { type: object, required: [projectId, paths], properties: { projectId: { type: string }, paths: { type: array, items: { type: string } }, deferIndexing: { type: boolean, default: false } } } } }
      responses: { '200': { description: 'deleted/unknown；延迟模式追加 indexingDeferred=true，随后必须 flush' } }
  /api/sync/status/{projectId}:
    get:
      tags: [sync]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: progressOnly, in: query, schema: { type: boolean, default: false }, description: '仅就绪度快照，不开索引库、不统计 blob 大小' }
      responses: { '200': { description: '默认 SyncStatus；progressOnly=true 仅 projectId/pendingJobs/indexProgress/skippedFiles' } }

  /api/query/search:
    post:
      tags: [query]
      summary: Fast 模式（Module/02+03）；返回服务端渲染的 Markdown 与 meta
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [projectId, query]
              properties:
                projectId: { type: string }
                checkpointId: { type: string }
                query: { type: string }
                maxTokens: { type: integer, default: 14000 }
      responses: { '200': { description: SearchResponse } }
  /api/query/ask:
    post:
      tags: [query]
      summary: Deep 模式（Module/02+03+04）；LLM 未配置/失败时走 D-26 降级包
      requestBody:
        content: { application/json: { schema: { type: object, required: [projectId, question], properties: { projectId: { type: string }, checkpointId: { type: string }, question: { type: string } } } } }
      responses: { '200': { description: AskResponse } }

  /healthz:
    get:
      tags: [ops]
      security: []
      summary: 存活 + 依赖检查
      responses: { '200': { description: OK } }
  /api/usage/projects/{id}:
    get:
      tags: [ops]
      summary: 查询审计（Module/04 §8 存档的读取口）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }

  /api/request-log/{requestId}:
    get:
      tags: [ops]
      summary: 按 trace id 查请求日志（TASK-090；仅能查自己发起的请求，他人 id 与不存在同样 404）
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: RequestLogEntry }
        '404': { description: 不存在 / 不属于当前账户 / 已被窗口清理 }

  /api/meta:
    get:
      tags: [ops]
      summary: 部署形态 + 生效配置（**免鉴权**；TASK-060/088/094/099）
      security: []
      responses: { '200': { description: '{ version, localMode, authRequired, registerOpen, needsBootstrap, userCount, config }' } }
  /api/account/overview:
    get:
      tags: [ops]
      summary: 首页仪表盘（账户资料 + 索引统计 + 查询用量 + 存储配额；TASK-062/064/094/110）
      parameters: [{ name: days, in: query, required: false, schema: { type: integer, default: 30 } }]
      responses: { '200': { description: AccountOverview } }
  /api/index-stats:
    get:
      tags: [ops]
      summary: 跨项目索引汇总（当前用户的项目；TASK-062）
      responses: { '200': { description: IndexStats } }
  /api/projects/{id}/index-runs:
    get:
      tags: [ops]
      summary: 单项目索引历史（TASK-062）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'IndexRun[]' } }
  /api/projects/{id}/index-stats:
    get:
      tags: [ops]
      summary: 单项目索引统计（内存态当前进度 + 落库聚合 + 磁盘占用；TASK-062）
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: ProjectIndexStats } }
  /api/usage/summary:
    get:
      tags: [ops]
      summary: 跨项目查询用量汇总（TASK-064）
      parameters: [{ name: days, in: query, required: false, schema: { type: integer, default: 30 } }]
      responses: { '200': { description: UsageSummary } }
  /api/calls/{callId}:
    get:
      tags: [ops]
      summary: 一次 Tool 调用的完整时间线（TASK-099 §B；越权与不存在同为 404）
      parameters: [{ name: callId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'CallTimeline' }, '404': { description: call_not_found } }

  # ------------------------------------------------------------------ 管理员后台（TASK-110 §3.5）
  # 全部走 require_admin：非管理员一律 403 admin_required，且**不泄露资源是否存在**
  # （不存在的用户 id 与无权限用同一个错误码）。
  /api/admin/users:
    get:
      tags: [admin]
      summary: 用户列表（含 Project 数 / 索引占用 / 检索次数 / 最后活跃）
      responses: { '200': { description: 'AdminUser[]' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /api/admin/users/{userId}:
    patch:
      tags: [admin]
      summary: 改身份 / 配额 / 封禁状态（只改给到的字段；封禁**立即**对全部凭据生效）
      parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
      requestBody:
        content: { application/json: { schema: { type: object, properties: { role: { enum: [admin, beta, public] }, quotaBytes: { type: integer, nullable: true, description: "null = 恢复按角色默认" }, banned: { type: boolean } } } } }
      responses:
        '200': { description: AdminUser }
        '400': { description: 'invalid_role / invalid_quota / invalid_admin_action（如封禁自己）' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/invites:
    get:
      tags: [admin]
      summary: 邀请码列表 + 使用记录
      responses: { '200': { description: '{ invites, kinds, quotaByRole }' } }
    post:
      tags: [admin]
      summary: 创建邀请码（指定类型/次数/有效期；码面可自选，须与类型首字母一致）
      requestBody:
        content: { application/json: { schema: { type: object, properties: { kind: { enum: [A, B, C] }, maxUses: { type: integer, default: 1 }, expiresInDays: { type: integer, nullable: true, description: "不传 = 永久" }, code: { type: string } } } } }
      responses:
        '201': { description: Invite }
        '400': { description: 'invalid_invite_kind / invalid_invite_uses / invalid_invite_expiry / invalid_invite_code' }
        '409': { description: invite_code_taken }
  /api/admin/invites/{code}:
    delete:
      tags: [admin]
      summary: 失效邀请码（软删；使用记录保留供排查）
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: No Content }, '404': { description: invite_not_found } }
  /api/admin/projects:
    get:
      tags: [admin]
      summary: 全部项目 + 索引健康（跨用户；按占用降序；可按 userId 筛选）
      parameters:
        - { name: userId, in: query, required: false, schema: { type: string }, description: "不传 = 全部人员" }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 0 }, description: "0 = 不限制" }
      responses: { '200': { description: '{ projects, totalBytes, owners }' } }
  /api/admin/projects/{projectId}:
    delete:
      tags: [admin]
      summary: 删除任意项目（管理员；级联删除索引数据，归属行一并清理）
      parameters: [{ name: projectId, in: path, required: true, schema: { type: string } }]
      responses: { '204': { description: No Content }, '404': { description: project_not_found } }
  /api/admin/stats:
    get:
      tags: [admin]
      summary: 调用统计（Search/Ask 次数、Token、错误率；可按 userId 查询单个用户）
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer, default: 30 } }
        - { name: userId, in: query, required: false, schema: { type: string }, description: "不传 = 全站" }
      responses: { '200': { description: AdminStats } }
  /api/admin/system:
    get:
      tags: [admin]
      summary: 系统状态（服务形态 + Embedding/LLM；与 /healthz?deep=1 **同源**）
      responses: { '200': { description: Health } }
